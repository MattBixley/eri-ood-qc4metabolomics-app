# Batch Connect app configuration file
#
# @note Used to define the submitted cluster, title, description, and
#   hard-coded/user-defined attributes that make up this Batch Connect app.
---

# **MUST** set cluster id here that matches cluster configuration file located
# under /etc/ood/config/clusters.d/*.yml
cluster: "slurm"

form:
  - bc_queue
  - bc_num_hours
description: Request a QC4Metabolomics session
submit: submit.yml.erb
title: QC4Metabolomics


# Define attribute values that aren't meant to be modified by the user within
# the Dashboard form.
#
# @note Unlike the eri-ood-rstudio-server-app this is based on, cores/memory
#   are NOT exposed as adjustable fields here: QC4Metabolomics's own
#   run_qc.sh always requests a whole node (`--exclusive`), so a bigger
#   core/mem pick from the user wouldn't actually change anything - see
#   submit.yml.erb, which hard-codes the same --cpus-per-task=8 --mem=14gb
#   --exclusive that run_qc.sh uses.
attributes:
  # @note "interactive" is what the reference eri-ood-rstudio-server-app
  #   uses and is known to work on this cluster's OOD config; submit.yml.erb
  #   also hard-codes `--partition=compute` (matching run_qc.sh) as a native
  #   arg, which may be redundant with (or need reconciling against)
  #   whatever partition "interactive" maps to in
  #   /etc/ood/config/clusters.d/slurm.yml - check that on deploy.
  bc_queue:
    value: interactive

  bc_num_hours:
    max: 8
    min: 1
    step: 1
    value: 1
    widget: number_field


# All of the attributes that make up the Dashboard form (in respective order),
# and made available to the submit configuration file and the template ERB
# files
#
# @note You typically do not need to modify this unless you want to add a new
#   configurable value
# @note If an attribute listed below is hard-coded above in the `attributes`
#   option, then it will not appear in the form page that the user sees in the
#   Dashboard
