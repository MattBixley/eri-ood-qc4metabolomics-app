# Batch Connect app configuration file
#
# @note Used to define the submitted cluster, title, description, and
#   hard-coded/user-defined attributes that make up this Batch Connect app.
---

# **MUST** set cluster id here that matches cluster configuration file located
# under /etc/ood/config/clusters.d/*.yml
cluster: "slurm"

form:
  - bc_num_hours
  - partition
  - num_cores
  - num_mem
description: Request a QC4Metabolomics session
submit: submit.yml.erb
title: QC4Metabolomics


# Define attribute values that aren't meant to be modified by the user within
# the Dashboard form.
#
# @note There's no `bc_queue` widget here (unlike the reference RStudio app):
#   `bc_queue`'s queue->partition mapping and an explicit `--partition=...`
#   native arg both applying at once (which is what the first build here
#   did, redundantly landing on the same partition only by coincidence) is
#   exactly the kind of double-mapping that's easy to get subtly wrong.
#   `partition` below (a plain select, not a bc_* smart attribute) is now
#   the single, explicit source of truth for which partition gets used - see
#   submit.yml.erb.
attributes:
  bc_num_hours:
    max: 8
    min: 1
    step: 1
    value: 1
    widget: number_field

  # @note Options taken from `sinfo`/`scontrol show partition` on this
  #   cluster (2026-08-18): compute (6 nodes, 14 day max), interactive
  #   (3 nodes, 60 day max), hugemem (2 nodes, 14 day max). gpu/vgpu are
  #   deliberately left out - this app has no GPU workload. "compute"
  #   matches run_qc.sh and stays the default; re-check this list if
  #   partitions are ever renamed/added/removed on this cluster.
  partition:
    label: "Partition"
    widget: select
    options:
      - ["compute", "compute"]
      - ["interactive", "interactive"]
      - ["hugemem", "hugemem"]

  # @note These are real limits, enforced by SLURM's cgroups: the job does
  #   NOT request --exclusive (an earlier version of this app did, which is
  #   also why it always showed the whole node's core count regardless of
  #   what was picked here - removed). Since the node is now shared with
  #   other jobs, template/before.sh.erb picks a random port for mariadb
  #   the same way it already did for Shiny, instead of the fixed 3306 in
  #   settings_demo.env - see script.sh.erb. Bounds below match/exceed
  #   run_qc.sh's own request (8 cores, 14GB); adjust the max if this
  #   cluster's "compute" nodes are smaller/larger than that.
  num_cores:
    label: "Number of cores"
    widget: number_field
    min: 4
    max: 32
    step: 1
    value: 8

  num_mem:
    label: "Memory (GB)"
    widget: number_field
    min: 8
    max: 64
    step: 1
    value: 14


# All of the attributes that make up the Dashboard form (in respective order),
# and made available to the submit configuration file and the template ERB
# files
#
# @note You typically do not need to modify this unless you want to add a new
#   configurable value
# @note If an attribute listed below is hard-coded above in the `attributes`
#   option, then it will not appear in the form page that the user sees in the
#   Dashboard
